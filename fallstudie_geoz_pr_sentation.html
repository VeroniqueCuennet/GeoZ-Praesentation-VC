        // State variables
        let currentSlide = 0;
        let notesVisible = false;
        let timerSeconds = 15 * 60; // 15 minutes
        let timerInterval = null;
        let isTimerRunning = false;

        // Render functions
        function initApp() {
            populateSlideSelect();
            renderSlide();
            renderDots();
            startTimerLogic();
        }

        function populateSlideSelect() {
            const select = document.getElementById('slide-select');
            select.innerHTML = '';
            slides.forEach((s, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `Slide ${idx + 1}: ${s.title.substring(0, 22)}...`;
                select.appendChild(opt);
            });
        }

        function renderSlide() {
            const s = slides[currentSlide];
            document.getElementById('slide-category').innerHTML = `<span class="w-2 h-2 rounded-full bg-zh-red"></span><span>${s.category}</span>`;
            document.getElementById('slide-counter-badge').innerText = `Slide ${currentSlide + 1} / ${slides.length}`;
            document.getElementById('slide-content').innerHTML = s.content;
            document.getElementById('slide-footer-subtitle').innerText = s.footer;
            document.getElementById('notes-text').innerText = s.notes;
            document.getElementById('slide-select').value = currentSlide;

            // Nav buttons
            document.getElementById('prev-btn').disabled = (currentSlide === 0);
            const nextBtn = document.getElementById('next-btn');
            if (currentSlide === slides.length - 1) {
                nextBtn.innerHTML = `<span>Abschluss</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
            } else {
                nextBtn.innerHTML = `<span>Weiter</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>`;
            }

            renderDots();
        }

        function renderDots() {
            const container = document.getElementById('dot-indicators');
            container.innerHTML = '';
            slides.forEach((_, idx) => {
                const dot = document.createElement('button');
                dot.className = `h-2 rounded-full transition-all ${idx === currentSlide ? 'bg-zh-blue w-6' : 'bg-slate-700 hover:bg-slate-600 w-2'}`;
                dot.onclick = () => goToSlide(idx);
                container.appendChild(dot);
            });
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            } else {
                showToast("Präsentation beendet. Bereit für die Diskussion & Fallstudie 2!");
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function goToSlide(idx) {
            currentSlide = idx;
            renderSlide();
        }

        function toggleNotes() {
            notesVisible = !notesVisible;
            const el = document.getElementById('speaker-notes');
            const btn = document.getElementById('notes-btn');
            if (notesVisible) {
                el.classList.remove('hidden');
                btn.classList.add('bg-zh-blue', 'text-white', 'border-zh-blue');
            } else {
                el.classList.add('hidden');
                btn.classList.remove('bg-zh-blue', 'text-white', 'border-zh-blue');
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Timer functions
        function startTimerLogic() {
            updateTimerDisplay();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('play-icon').innerHTML = `<path d="M8 5v14l11-7z"/>`;
                document.getElementById('timer-dot').classList.remove('bg-emerald-500');
                document.getElementById('timer-dot').classList.add('bg-amber-500');
            } else {
                isTimerRunning = true;
                document.getElementById('play-icon').innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
                document.getElementById('timer-dot').classList.remove('bg-amber-500');
                document.getElementById('timer-dot').classList.add('bg-emerald-500');
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        showToast("15 Minuten Präsentationszeit abgelaufen!");
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 15 * 60;
            updateTimerDisplay();
            document.getElementById('play-icon').innerHTML = `<path d="M8 5v14l11-7z"/>`;
            document.getElementById('timer-dot').classList.remove('bg-amber-500');
            document.getElementById('timer-dot').classList.add('bg-emerald-500');
        }

        function updateTimerDisplay() {
            const min = Math.floor(timerSeconds / 60);
            const sec = timerSeconds % 60;
            document.getElementById('timer-display').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-zh-blue text-white px-6 py-3 rounded-xl shadow-2xl z-50 text-xs md:text-sm font-semibold border border-blue-400';
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // Keyboard Controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'n' || e.key === 'N') {
                toggleNotes();
            }
        });

        window.onload = initApp;
    </script>
